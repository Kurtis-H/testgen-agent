[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testgen-agent"
version = "0.1.0"
description = "An AI agent that writes API tests from an OpenAPI spec - and has to prove each one before it's kept."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pytest>=8"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest-cov>=5", "mypy>=1.10", "pip-audit>=2.7"]

[project.scripts]
testgen = "testgen_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# The example output is kept exactly as testgen wrote it.
extend-exclude = ["examples/generated"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/testgen_agent/planner.py" = ["E501"]
"src/testgen_agent/cli.py" = ["E501"]  # markdown table rows
"tests/*" = ["E501"]
