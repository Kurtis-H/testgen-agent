name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Older Python images bundle outdated packaging tools with known CVEs; update them first.
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: Type check (mypy)
        run: mypy --ignore-missing-imports src
      - name: Tests with coverage (fails under 80%)
        run: pytest -q --cov=testgen_agent --cov-report=term-missing --cov-fail-under=80
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable

  # End to end against bug-hunt-lab: generate tests against the correct API, then score
  # them against copies of the API with one known bug each (mutants).
  against-bug-hunt-lab:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/bug-hunt-lab
          path: bug-hunt-lab
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Start the correct API and five mutants
        working-directory: bug-hunt-lab
        run: |
          start() { BUGS=$1 PORT=$2 ALLOW_TOGGLE=0 nohup node app/server.mjs > /dev/null 2>&1 & }
          start none 3000
          start TABLE-2 3001; start TABLE-3 3002; start TABLE-4 3003; start SIGNUP-1 3004; start SIGNUP-2 3005
          for p in 3000 3001 3002 3003 3004 3005; do
            for i in $(seq 1 30); do curl -sf "http://127.0.0.1:$p/api/health" > /dev/null && break; sleep 0.5; done
          done
      - name: Generate and score (scripted planner - no GPU in CI)
        run: |
          testgen --spec examples/bug-hunt-lab.openapi.json --base-url http://127.0.0.1:3000 --provider fake \
            --out generated --md report.md --min-mutation-score 0.8 \
            --mutant TABLE-2=http://127.0.0.1:3001 --mutant TABLE-3=http://127.0.0.1:3002 \
            --mutant TABLE-4=http://127.0.0.1:3003 --mutant SIGNUP-1=http://127.0.0.1:3004 \
            --mutant SIGNUP-2=http://127.0.0.1:3005
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: generated-tests
          path: |
            generated/
            report.md
